spring.application.name=realestate-api
server.port=${PORT:8080}
spring.threads.virtual.enabled=true
# Cloud Run terminates TLS; use its X-Forwarded-* headers so generated URLs are https.
server.forward-headers-strategy=framework

# Errors as RFC 9457 problem details.
spring.mvc.problemdetails.enabled=true

# In-memory database until Cloud SQL is attached; recreated (and re-seeded) on every start.
spring.datasource.url=jdbc:h2:mem:realestate;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100

# Browser origins allowed to call /api/** (comma-separated). The default is the local Nuxt dev
# server; on Cloud Run realestate-infrastructure sets realestate-web's URL.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Cloud Storage bucket for uploaded images (set by realestate-infrastructure). Unset: images are
# kept in memory and lost on restart.
app.images.bucket=${IMAGE_BUCKET:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Password of the seeded admin user. No default: when unset, no admin is created.
app.seed.admin-password=${ADMIN_PASSWORD:}

# JWT. The defaults are TEMPORARY and public, for local runs only; on Cloud Run both come from
# Secret Manager (realestate-infrastructure secrets.tf).
app.jwt.issuer=realestate-api
app.jwt.access.secret=${ACCESS_TOKEN_SECRET:TEMPORARY_ACCESS_TOKEN_SECRET_CHANGE_ME}
app.jwt.access.ttl=15m
app.jwt.refresh.secret=${REFRESH_TOKEN_SECRET:TEMPORARY_REFRESH_TOKEN_SECRET_CHANGE_ME}
app.jwt.refresh.ttl=7d
