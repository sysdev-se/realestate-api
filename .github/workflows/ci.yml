name: CI / Deploy

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  GCP_PROJECT: realestate-prod-000001
  GCP_REGION: asia-southeast1
  SERVICE: realestate-api
  IMAGE: asia-southeast1-docker.pkg.dev/realestate-prod-000001/containers/realestate-api:${{ github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test
        run: ./mvnw -B -ntp verify

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    # Deploys queue instead of overlapping; a running deploy is never cancelled.
    concurrency:
      group: deploy-prod-realestate-api
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Paketo builds the native image inside Docker with GraalVM 25 (BP_JVM_VERSION in pom.xml),
      # so the runner doesn't need GraalVM. Tests already ran in the verify job.
      - name: Build native image
        run: ./mvnw -B -ntp -Pnative -DskipTests spring-boot:build-image -Dspring-boot.build-image.imageName="$IMAGE"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Push image
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker push "$IMAGE"

      # Only --image: Terraform (realestate-infrastructure) owns everything else about the service.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT" \
            --quiet
